# Copy to .github/workflows/ in the repository you want to protect.
name: approved contributors
on:
  schedule:
#    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  # GitHub only shows collaborator permissions to tokens with push access.
  contents: write
  pull-requests: write
  issues: write

# Serialize sweeps so a PR isn't commented on twice.
concurrency:
  group: approved-contributors
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APPROVED_CONTRIBUTORS_APP_ID }}
          private-key: ${{ secrets.APPROVED_CONTRIBUTORS_APP_KEY }}
          owner: bytecodealliance
          repositories: contributor-permissions
      - uses: bytecodealliance/approved-contributors@v0.0.1
        with:
          permissions-repo: bytecodealliance/contributor-permissions
          allowlist-path: wstd-test.txt
          permissions-token: ${{ steps.app-token.outputs.token }}
          # blocklist-path: blocked-contributors.txt
          # Needs contents read/write on my-org/governance and organization
          # Members read, for vouch-team. See the README.
          # permissions-token: ${{ secrets.APPROVED_CONTRIBUTORS_TOKEN }}
          # vouch-team: my-org/maintainers
          message: |
            Thanks for the PR, @{author}! This project only accepts pull
            requests from approved contributors, so it has been closed
            automatically. Please open an issue to discuss your change first.
          blocked-message: |
            @{author} is not permitted to contribute to this project, so this
            pull request has been closed automatically.
